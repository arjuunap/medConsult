<div class="cases-grid">
  <div
    *ngFor="let c of cases"
    class="case-card"
  >
    <div class="card-inner" (click)="goToCaseDiscussion(c.caseId)">

      <!-- Top -->
      <div class="card-top">
        <span class="case-code">{{ c.caseCode }}</span>

        <div class="badges">
          <span
            class="badge"
            [ngClass]="{
              'open': c.status === 'OPEN',
              'closed': c.status === 'CLOSED',
              'pending': c.status === 'PENDING'
            }"
          >
            {{ c.status }}
          </span>
        </div>
      </div>

      <!-- Title -->
      <div class="case-title">
        {{ c.title }}
      </div>

      <!-- Description -->
      <div class="case-description">
        {{ c.description }}
      </div>

      <!-- Patient -->
      <div class="patient-section">
        <div class="patient-avatar">
          {{ c.patient?.firstName?.charAt(0) }}
        </div>

        <div class="patient-info">
          <div class="patient-name">
            {{ c.patient?.firstName }}
            {{ c.patient?.lastName }}
          </div>

          <div class="patient-id">
            Patient ID: {{ c.patientId }}
          </div>
        </div>
      </div>   

      <!-- Footer -->
      <div class="card-footer">
        <div class="members">
          <i class="ti ti-users"></i>
          {{ c.roomMembers?.length || 0 }} Members
        </div>

        <div class="card-action">
          Open Room
          <i class="ti ti-arrow-right"></i>
        </div>
      </div>

    </div>
  </div>
</div>
