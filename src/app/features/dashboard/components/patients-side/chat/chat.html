<!-- chat.html -->
<div class="chat-root">

  <!-- Header -->
  <div class="chat-header">
    <button class="back-btn" (click)="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="doctor-info">
      <div class="avatar-wrap">
        <div class="avatar-circle">{{ getInitials(doctorName) }}</div>
        <span class="status-dot" [class.online]="isOnline"></span>
      </div>
      <div class="doctor-meta">
        <span class="doctor-name">{{ doctorName }}</span>
        <span class="doctor-status">{{ isOnline ? 'Online now' : 'Offline' }}</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" title="Video call">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </button>
      <button class="icon-btn" title="More options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages-area" #messageContainer>
    <div class="messages-inner">

      <ng-container *ngFor="let msg of messages; let i = index">

        <!-- Date separator -->
        <div class="date-separator" *ngIf="showDateSeparator(i)">
          <span>{{ formatDateGroup(msg.createdAt) }}</span>
        </div>

        <!-- Message bubble -->
        <div class="message-row" [class.own]="isOwnMessage(msg)">

          <!-- Avatar (doctor only) -->
          <div class="msg-avatar" *ngIf="!isOwnMessage(msg)">
            {{ getInitials(msg.senderName) }}
          </div>

          <div class="bubble-group">
            <div class="bubble" [class.own-bubble]="isOwnMessage(msg)" [class.other-bubble]="!isOwnMessage(msg)">
              <p class="bubble-text">{{ msg.content }}</p>
              <div class="bubble-meta">
                <span class="msg-time">{{ formatTime(msg.createdAt) }}</span>
                <span class="read-tick" *ngIf="isOwnMessage(msg)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" [attr.stroke]="msg.isRead ? '#34d399' : '#9ca3af'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

      </ng-container>

      <!-- Typing indicator -->
      <div class="message-row" *ngIf="isTyping">
        <div class="msg-avatar">{{ getInitials(doctorName) }}</div>
        <div class="bubble other-bubble typing-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

    </div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <!-- Emoji picker -->
    <div class="emoji-picker" *ngIf="showEmojiPicker">
      <button
        *ngFor="let emoji of emojis"
        class="emoji-btn"
        (click)="addEmoji(emoji)">{{ emoji }}</button>
    </div>

    <div class="input-row">
      <button class="input-icon-btn" (click)="toggleEmojiPicker()" title="Emoji">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </button>

      <button class="input-icon-btn" title="Attach file">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>

      <textarea
        #messageInput
        class="msg-input"
        [(ngModel)]="newMessage"
        (keydown)="onKeyDown($event)"
        placeholder="Type a message…"
        rows="1"
        maxlength="1000"
      ></textarea>

      <button
        class="send-btn"
        [class.active]="newMessage.trim().length > 0"
        (click)="sendMessage()"
        [disabled]="!newMessage.trim() || isSending"
        title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </div>

</div>
