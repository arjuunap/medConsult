<div class="layout-wrapper" [class.sidebar-open]="sidebarOpen">

  <!-- ── Top Navbar ── -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
      </div>
      <span class="brand-name">MedConsult</span>
    </div>

    <!-- Right Side Actions -->
    <div class="nav-actions">

      <!-- Hamburger Button (mobile only) -->
      <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Profile Button -->
      <button class="profile-btn" (click)="goToProfile()">
        <img *ngIf="user?.profilePhoto; else defaultIcon" [src]="user.profilePhoto" alt="Profile" class="profile-img" />
        <ng-template #defaultIcon>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </ng-template>
      </button>

      <!-- Logout Button -->
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="logout-text">Logout</span>
      </button>

    </div>
  </header>

  <!-- ── Left Sidebar ── -->
  <aside class="sidebar">
    <nav class="nav">

      <a routerLink="/layout/home"
        [class.active]="isActive()"
        class="nav-item"
        (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </span>
        <span class="nav-label">Home</span>
        <span class="active-bar"></span>
      </a>

      <a *ngIf="role === 'PATIENT'" routerLink="/layout/doctors" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path
              d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" />
            <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4" />
            <circle cx="20" cy="10" r="2" />
          </svg>
        </span>
        <span class="nav-label">Doctors</span>
        <span class="active-bar"></span>
      </a>

      <a routerLink="/layout/chat/8edfa69f-e696-4528-85fc-20336bed1299" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </span>
        <span class="nav-label">Chat</span>
        <span class="active-bar"></span>
      </a>

      <a *ngIf="role === 'PATIENT'" routerLink="/layout/show-vitals" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 21s-6-4.35-9-8a5.5 5.5 0 0 1 9-6 5.5 5.5 0 0 1 9 6c-3 3.65-9 8-9 8z" />
            <polyline points="3 12 7 12 9 8 11 16 13 12 17 12" />
          </svg>
        </span>
        <span class="nav-label">Vitals</span>
        <span class="active-bar"></span>
      </a>

      <a routerLink="/layout/lab-results" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M14.5 3h-5" />
            <path d="M9 3v6l-5 9a2 2 0 0 0 1.7 3h12.6a2 2 0 0 0 1.7-3l-5-9V3" />
          </svg>
        </span>
        <span class="nav-label">Lab Result</span>
        <span class="active-bar"></span>
      </a>

      <a routerLink="/layout/settings" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </span>
        <span class="nav-label">Settings</span>
        <span class="active-bar"></span>
      </a>

      <a *ngIf="role === 'DOCTOR'" routerLink="/layout/schedules" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </span>
        <span class="nav-label">Schedules</span>
        <span class="active-bar"></span>
      </a>

      <a routerLink="/layout/appointments" routerLinkActive="active"
        class="nav-item" (click)="closeSidebar()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 2h6"></path>
            <rect x="5" y="4" width="14" height="18" rx="2"></rect>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </span>
        <span class="nav-label">Appointments</span>
        <span class="active-bar"></span>
      </a>

    </nav>
  </aside>

  <!-- ── Sidebar Backdrop (mobile only) ── -->
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>

  <!-- ── Main Content ── -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
