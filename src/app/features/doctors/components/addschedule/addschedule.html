<div class="form-shell">
  <div class="form-card">
    <div class="form-header">
      <div class="header-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </svg>
      </div>
      <div>
        <p class="form-title">Add Schedule</p>
        <p class="form-subtitle">Define availability window</p>
      </div>
    </div>

    <form [formGroup]="scheduleForm" (ngSubmit)="onSubmit()" class="form-body">
      <div class="field">
        <label class="field-label">Day of Week</label>
        <select formControlName="dayOfWeek" class="field-input">
          <option value="">Select day</option>
          <option *ngFor="let day of days" [value]="day">{{ day }}</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label">Start Time</label>
          <input type="time" formControlName="startTime" class="field-input" />
        </div>
        <div class="field">
          <label class="field-label">End Time</label>
          <input type="time" formControlName="endTime" class="field-input" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label">Slot Duration (mins)</label>
          <input
            type="number"
            formControlName="slotDuration"
            class="field-input"
            placeholder="30"
          />
        </div>

        <div class="field">
          <label class="field-label">Gap Between Slots (mins)</label>
          <input type="number" formControlName="gapMinutes" class="field-input" placeholder="0" />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Schedule Type</label>
        <select formControlName="scheduleType" class="field-input">
          <option value="">Select type</option>
          <option value="REGULAR">Regular</option>
          <option value="ON_CALL">On call</option>
          <option value="OFF">Off</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label">Effective From</label>
          <input type="date" formControlName="effectiveFrom" class="field-input" />
        </div>
        <div class="field">
          <label class="field-label">Effective Until</label>
          <input type="date" formControlName="effectiveUntil" class="field-input" />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="backToSchedules()">Cancel</button>
        <button type="submit" class="btn-submit">Submit</button>
      </div>
    </form>
  </div>
</div>
